[Unit]
# Wait until the SDSP sensor configuration is in place and hexagonrpcd serves it
After=raphael-extras.service hexagonrpcd.service
Wants=raphael-extras.service
# The proxy exits when it cannot see any sensor yet; retry instead of giving up
StartLimitIntervalSec=0

[Service]
ExecStartPre=/usr/local/sbin/raphael-sensors-wait.sh
Restart=always
RestartSec=5
